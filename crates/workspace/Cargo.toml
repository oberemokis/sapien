# Рабочее место: сессии, терминалы и агенты вместе. Сценарии на несколько
# доменов (запуск панели, разговор от хука, имя из заголовка, удаление
# сессии и проекта) живут здесь, а соседние домены друг о друге не знают.
# Без Tauri: события и окно панели приходят портами.
[package]
name = "sapien-workspace"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
log.workspace = true
sapien-agents.workspace = true
sapien-kernel.workspace = true
sapien-sessions.workspace = true
sapien-terminal.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
