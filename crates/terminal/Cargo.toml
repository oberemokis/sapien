# Терминал: оболочка в псевдотерминале, её окружение и экран, который
# помнится для нового окна и следующего запуска. Об агентах не знает.
[package]
name = "sapien-terminal"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
portable-pty = "0.9.0"
sapien-kernel.workspace = true

# Терминал останавливается: SIGHUP группе оболочки и группе на переднем
# плане, чтобы вместе с оболочкой ушли и её команды.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
