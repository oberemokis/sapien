# Агенты в терминале: кто на переднем плане и как его назвать, разговор
# панели и его продолжение, хуки и интеграции агентов, Claude Code
# устройства. О терминале и сессиях не знает: связку держит приложение.
[package]
name = "sapien-agents"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sapien-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Сокет хуков стирает сокеты прошлых запусков, чьих процессов уже нет.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
