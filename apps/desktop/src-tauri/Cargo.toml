[package]
name = "sapien"
version = "0.0.0"
edition = "2024"

[lib]
# Суффикс _lib не даёт имени библиотеки совпасть с именем бинаря: на Windows
# это ломает сборку, https://github.com/rust-lang/cargo/issues/8519
name = "sapien_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
