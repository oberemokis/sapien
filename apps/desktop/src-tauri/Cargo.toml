[package]
name = "sapien"
# Версии здесь нет: версия приложения одна, в apps/desktop/package.json,
# tauri.conf.json берёт её оттуда.
edition.workspace = true

[lib]
# Суффикс _lib не даёт имени библиотеки совпасть с именем бинаря: на Windows
# это ломает сборку, https://github.com/rust-lang/cargo/issues/8519
name = "sapien_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log.workspace = true
robius-authentication = "0.3.1"
sapien-agents.workspace = true
sapien-forge.workspace = true
sapien-kernel.workspace = true
sapien-projects.workspace = true
sapien-sessions.workspace = true
sapien-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
# Без zip: он распаковывает только архивы обновлений старого формата
# (v1Compatible), а createUpdaterArtifacts пишет установщик и AppImage как есть.
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
