[package]
name = "sapien"
version = "0.0.0"
edition = "2024"

[lib]
# Суффикс _lib не даёт имени библиотеки совпасть с именем бинаря: на Windows
# это ломает сборку, https://github.com/rust-lang/cargo/issues/8519
name = "sapien_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify-debouncer-mini = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5.2.9"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
