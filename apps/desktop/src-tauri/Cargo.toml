[package]
name = "sapien"
# Версии здесь нет: версия приложения одна, в apps/desktop/package.json,
# tauri.conf.json берёт её оттуда.
edition = "2024"

[lib]
# Суффикс _lib не даёт имени библиотеки совпасть с именем бинаря: на Windows
# это ломает сборку, https://github.com/rust-lang/cargo/issues/8519
name = "sapien_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.2.0"
log = "0.4.34"
# Псевдотерминал для интерактивного Claude Code во вкладке.
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy"] }
robius-authentication = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
# Без zip: он распаковывает только архивы обновлений старого формата
# (v1Compatible), а createUpdaterArtifacts пишет установщик и AppImage как есть.
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1.54.1", features = ["process", "sync", "time"] }
url = "2"

# Терминал останавливается: SIGHUP группе оболочки и группе на переднем
# плане, чтобы вместе с оболочкой ушли и её команды.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
