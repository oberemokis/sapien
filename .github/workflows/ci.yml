# Проверки пул-реквеста и ветки main. Сборка и выпуск идут
# по тегу версии в release.yml.
#
# Работа одна, а не по работе на проверку: дорогая часть у всех трёх общая,
# это сборка зависимостей Rust, и в разных работах она шла бы трижды.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Толчок поверх незаконченного прогона его отменяет: в очереди имеет смысл
# держать только последний коммит ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: проверки
    # Приложение только для macOS, и код под #[cfg(target_os = "macos")]
    # проверяется только там.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm ci

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
