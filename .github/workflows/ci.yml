# Проверки пул-реквеста и ветки main. Сборка и выпуск идут
# по тегу версии в release.yml.
#
# Работа одна, а не по работе на проверку: дорогая часть у всех трёх общая,
# это сборка зависимостей Rust, и в разных работах она шла бы трижды.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Толчок поверх незаконченного прогона его отменяет: в очереди имеет смысл
# держать только последний коммит ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: проверки
    # Приложение только для macOS, и код под #[cfg(target_os = "macos")]
    # проверяется только там.
    runs-on: macos-latest
    env:
      TURBO_CACHE_DIR: .turbo/cache
      # Задачи интерфейса на пул-реквесте идут только у изменённых пакетов
      # и зависимых от них, на main у всех.
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

    steps:
      # --affected сравнивает с базой пул-реквеста: нужна история.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm ci

      # Кеш задач turbo между прогонами. Ключ у каждого прогона свой, поэтому
      # кеш сохраняется всегда, а поднимается последний из ветки или из main.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Задачи Rust корневые, и --affected их не выбирает: правку в src-tauri
      # turbo относит к пакету окна. Их пропускает кеш turbo по входам из
      # turbo.json, а когда в кеше все четыре, Rust даже не ставится.
      - id: rust
        run: |
          missed=$(pnpm exec turbo run rust:check rust:clippy rust:fmt rust:test --dry=json | jq '[.tasks[] | select(.cache.status != "HIT")] | length')
          echo "run=$([ "$missed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Версия, clippy и rustfmt из rust-toolchain.toml.
      - if: steps.rust.outputs.run == 'true'
        run: rustup toolchain install

      # Cargo workspace в корне: кеш по Cargo.lock и target/ оттуда же.
      - if: steps.rust.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2

      - run: pnpm exec turbo run typecheck test $AFFECTED

      - run: pnpm lint

      - run: pnpm exec turbo run rust:check rust:test
