packages:
  - "apps/*"
  - "packages/*"

# esbuild приходит с Vite. Его скрипт проверяет, что бинарь под платформу
# на месте, и без разрешения pnpm 11 роняет установку.
allowBuilds:
  esbuild: true

# Версии, общие для пакетов: у двух копий react или TanStack Query в одном
# окне свои контексты, и хук одной не видит провайдера другой.
catalog:
  "@tanstack/react-query": ^5.105.0
  "@types/node": ^22.20.5
  "@types/react": ~19.3.0
  "@types/react-dom": ^19.3.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  vitest: ^4.1.12
