packages:
  - "apps/*"
  - "domains/*"
  - "packages/*"

# esbuild приходит с Vite. Его скрипт проверяет, что бинарь под платформу
# на месте, и без разрешения pnpm 11 роняет установку.
allowBuilds:
  esbuild: true

# Версии, общие для пакетов: у двух копий react, i18next или TanStack Query
# в одном окне свои контексты, и хук одной не видит провайдера другой.
catalog:
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-store": ^0.11.2
  "@tauri-apps/api": ^2.12.4
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/node": ^22.20.5
  "@types/react": ~19.3.0
  "@types/react-dom": ^19.3.0
  happy-dom: ^20.14.6
  i18next: ^26.5.11
  react: 19.3.0
  react-dom: 19.3.0
  react-i18next: ^17.1.9
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  vitest: ^4.1.12
